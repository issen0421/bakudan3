<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>QWERTY Protocol</title>
    <style>
        body { font-family: sans-serif; background: #f5f5f5; text-align: center; padding: 20px; }
        .btn { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; border-radius: 5px; border: none; background: #007bff; color: white;}
        .btn:hover { background: #0056b3; }
        
        /* --- 小謎入力エリア --- */
        .terminal-box { background: #222; color: #0f0; padding: 20px; border-radius: 5px; margin: 20px auto; max-width: 600px; }
        .terminal-box input { padding: 8px; font-size: 18px; width: 200px; text-align: center; border: 1px solid #555; }
        .feedback { margin-top: 10px; font-weight: bold; min-height: 24px; }

        /* --- スロットエリア --- */
        .puzzle-area { margin: 40px auto; max-width: 800px; }
        
        .slots-container {
            display: flex; gap: 40px; 
            width: fit-content; margin: 0 auto 40px auto;
            position: relative; padding: 20px 0;
            background: linear-gradient(to bottom, 
                transparent 24%, black 24%, black 26%, 
                transparent 26%, transparent 49%, 
                black 49%, black 51%, 
                transparent 51%, transparent 74%, 
                black 74%, black 76%, transparent 76%);
        }
        
        .slot {
            width: 60px; height: 180px;
            border: 3px solid black; background: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; z-index: 1; transition: 0.2s;
        }
        .slot.drag-over { background: #e0f7fa; border-color: #00acc1; }

        /* --- アイコンプール --- */
        .items { display: flex; justify-content: center; gap: 30px; min-height: 200px; padding: 20px; border: 2px dashed transparent; }
        .items.drag-over { border-color: #888; background: #eaeaea; border-radius: 10px; }
        
        .item {
            width: 60px; height: 180px; background: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; cursor: grab;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.2); transition: transform 0.1s;
        }
        .item:active { cursor: grabbing; transform: scale(0.95); }
    </style>
</head>
<body>

    <h2>QWERTY Protocol / ターミナル</h2>
    <button class="btn" onclick="connectSerial()">🔌 デバイス接続</button>

    <!-- 小謎入力エリア -->
    <div class="terminal-box">
        <p>小謎の答えを入力してデータ解析を実行せよ</p>
        <input type="text" id="answerInput" placeholder="例: くま">
        <button class="btn" onclick="submitAnswer()">解析</button>
        <div class="feedback" id="terminalFeedback"></div>
    </div>

    <!-- メインパズルエリア -->
    <div class="puzzle-area">
        <div class="slots-container" id="slotsArea">
            <div class="slot" data-index="0" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
            <div class="slot" data-index="1" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
            <div class="slot" data-index="2" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
            <div class="slot" data-index="3" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
            <div class="slot" data-index="4" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
        </div>

        <div class="items" id="item-pool" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)">
            <div class="item" draggable="true" id="SUN" ondragstart="drag(event)">☀️</div>
            <div class="item" draggable="true" id="MON" ondragstart="drag(event)">🌙</div>
            <div class="item" draggable="true" id="TUE" ondragstart="drag(event)">🔥</div>
            <div class="item" draggable="true" id="WED" ondragstart="drag(event)">💧</div>
            <div class="item" draggable="true" id="THU" ondragstart="drag(event)">🌳</div>
            <div class="item" draggable="true" id="FRI" ondragstart="drag(event)">💰</div>
            <div class="item" draggable="true" id="SAT" ondragstart="drag(event)">🪐</div>
        </div>

        <button class="btn" style="background: #28a745; margin-top: 30px;" onclick="executeMainPuzzle()">EXECUTE (実行)</button>
    </div>

    <script>
        let port;
        let writer;
        let segTimer; // 7セグ用のタイマー変数
        let ledTimer; // LED用のタイマー変数

        const puzzleDict = {
            "くま": "BEAR",
            "とり": "BIRD",
            "ほし": "STAR",
            "つき": "MOON",
            "かぎ": "KEYS",
            "ほん": "BOOK"
        };

        const QWERTY_TOP = "QWERTYUIOP";
        const QWERTY_MID = "ASDFGHJKL";
        const QWERTY_BOT = "ZXCVBNM";

        function getRow(char) {
            if (QWERTY_TOP.includes(char)) return 1;
            if (QWERTY_MID.includes(char)) return 2;
            if (QWERTY_BOT.includes(char)) return 3;
            return 0;
        }

        async function connectSerial() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                const encoder = new TextEncoderStream();
                encoder.readable.pipeTo(port.writable);
                writer = encoder.writable.getWriter();
                alert("接続成功！");
            } catch (err) { alert("接続エラー: " + err); }
        }

        async function sendCommand(cmd) {
            if (writer) await writer.write(cmd + "\n");
        }

        // --- 小謎の入力処理 ---
        function submitAnswer() {
            const input = document.getElementById("answerInput").value.trim();
            const feedback = document.getElementById("terminalFeedback");
            
            // 既存の7セグ消灯タイマーをリセット
            if (segTimer) clearTimeout(segTimer);

            if (puzzleDict[input]) {
                const word = puzzleDict[input];
                feedback.style.color = "#0f0";
                // ★英単語を隠し、データ出力のみを通知
                feedback.innerText = `データ承認: 該当データを7セグモニターへ出力します`;
                
                let cmd = "S";
                for(let i = 0; i < 4; i++) {
                    cmd += getRow(word[i]);
                }
                sendCommand(cmd);

                // ★3秒後に7セグを消灯し、テキストも待機状態に戻す
                segTimer = setTimeout(() => {
                    sendCommand("S0000");
                    feedback.innerText = "スタンバイ...";
                }, 3000);

            } else {
                feedback.style.color = "red";
                feedback.innerText = "エラー: 該当するデータが見つかりません";
                sendCommand("S0000");
            }
        }

        // --- ドラッグ＆ドロップ処理 ---
        function drag(e) { e.dataTransfer.setData("text", e.target.id); }
        function allowDrop(e) { 
            e.preventDefault(); 
            if(e.target.classList.contains('slot') || e.target.id === 'item-pool' || e.target.classList.contains('items')) {
                e.target.classList.add('drag-over'); 
            }
        }
        function dragLeave(e) { e.target.classList.remove('drag-over'); }
        
        function drop(e) {
            e.preventDefault();
            e.target.classList.remove('drag-over');
            
            let dropTarget = e.target;
            if (dropTarget.classList.contains('item')) {
                dropTarget = dropTarget.parentElement;
            }

            const data = e.dataTransfer.getData("text");
            const draggedElement = document.getElementById(data);
            
            if (dropTarget.classList.contains('slot')) {
                if (dropTarget.children.length > 0) {
                    document.getElementById("item-pool").appendChild(dropTarget.children[0]);
                }
                dropTarget.appendChild(draggedElement);
            } 
            else if (dropTarget.id === "item-pool" || dropTarget.classList.contains('items')) {
                document.getElementById("item-pool").appendChild(draggedElement);
            }
        }

        // --- 大謎(曜日スロット)の判定処理 ---
        function executeMainPuzzle() {
            const slots = document.querySelectorAll('.slot');
            let placedWords = [];
            
            for (let slot of slots) {
                if (slot.children.length === 0) {
                    alert("5つのモジュールを全てセットしてください。");
                    return;
                }
                placedWords.push(slot.children[0].id);
            }

            let validJoints = 0;
            
            for (let i = 0; i < 4; i++) {
                let word1 = placedWords[i];
                let word2 = placedWords[i+1];
                
                if (getRow(word1[0]) !== getRow(word2[0]) &&
                    getRow(word1[1]) !== getRow(word2[1]) &&
                    getRow(word1[2]) !== getRow(word2[2])) {
                    validJoints++;
                }
            }

            if (ledTimer) clearTimeout(ledTimer);

            if (validJoints === 0) {
                sendCommand("L0");
                sendCommand("B");
            } else {
                sendCommand("L" + validJoints);
                ledTimer = setTimeout(() => {
                    sendCommand("L0");
                }, 3000);
            }
            
            if (validJoints === 4) {
                clearTimeout(ledTimer);
                setTimeout(() => alert("🎉 SYSTEM UNLOCKED! 完全クリア！"), 500);
            }
        }
    </script>
</body>
</html>

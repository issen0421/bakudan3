<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>HACKER OS - ダッシュボード</title>
    <style>
        body { font-family: monospace; background: #0d1117; color: #c9d1d9; text-align: center; padding: 0; margin: 0; }
        
        /* --- グローバルヘッダー & タブ --- */
        .header { background: #161b22; padding: 15px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        .app-tabs { display: flex; gap: 10px; }
        .tab-btn { background: #21262d; color: #8b949e; border: 1px solid #30363d; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; font-family: monospace; transition: 0.2s; }
        .tab-btn:hover { background: #30363d; color: #c9d1d9; }
        .tab-btn.active { background: #1f6feb; color: white; border-color: #1f6feb; }
        
        .btn-connect { background: #238636; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .btn-connect:hover { background: #2ea043; }

        .app-container { display: none; padding: 30px; }
        .app-container.active { display: block; }

        /* --- 共通 UI --- */
        .execute-btn { background: #238636; color: white; font-size: 20px; padding: 15px; width: 100%; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .execute-btn:hover { background: #2ea043; }
        .result-msg { margin-top: 20px; font-size: 20px; font-weight: bold; min-height: 30px; line-height: 1.5; }
        .highlight { color: #58a6ff; font-weight: bold; }

        /* --- 共通 ターミナルボックス --- */
        .terminal-box { background: #000; color: #0f0; padding: 20px; border-radius: 5px; margin: 0 auto 30px auto; max-width: 600px; border: 1px solid #333; }
        .terminal-box input { padding: 8px; font-size: 18px; width: 200px; text-align: center; border: 1px solid #0f0; background: #111; color: #0f0; outline: none; }
        .terminal-box button { background: #0f0; color: #000; border: none; padding: 9px 20px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .feedback { margin-top: 10px; font-weight: bold; min-height: 24px; white-space: pre-line; }

        .hint-area { margin-top: 15px; display: none; background: #111; padding: 15px; border-radius: 5px; border: 1px dashed #0f0; }
        .hint-area p { color: #0f0; margin: 0 0 10px 0; font-size: 14px; }
        .carousel-container { display: flex; align-items: center; justify-content: center; gap: 15px; }
        .carousel-btn { background: none; border: none; color: #0f0; font-size: 30px; cursor: pointer; transition: 0.2s; }
        .carousel-btn:disabled { color: #333; cursor: not-allowed; }
        .hint-image-wrapper { width: 300px; height: 200px; display: flex; align-items: center; justify-content: center; background: #000; border-radius: 5px; overflow: hidden; border: 1px solid #333; }
        .hint-image-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .carousel-indicator { color: #0f0; font-size: 14px; margin-top: 10px; }

        /* --- STEP 1: C-123 制作ソフト --- */
        .s1-items { display: flex; justify-content: center; gap: 20px; margin: 30px 0; padding: 20px; border: 2px dashed #444; border-radius: 10px; background: #161b22; }
        .s1-item-slot { width: 60px; height: 60px; background: transparent; }
        .s1-item { width: 60px; height: 60px; background: #30363d; border: 2px solid #8b949e; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; cursor: grab; transition: transform 0.1s; color: #fff; }
        .s1-item:active { cursor: grabbing; border-color: #58a6ff; transform: scale(0.95); }
        
        .s1-slots { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
        .s1-slot { width: 60px; height: 60px; border: 2px dashed #555; background: #0d1117; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .s1-slot.drag-over { background: rgba(88, 166, 255, 0.2); border-color: #58a6ff; }

        /* --- STEP 2: データ転送 (抽象化水汲み) --- */
        .s2-container { display: flex; justify-content: center; gap: 60px; margin: 30px 0 60px 0; }
        .s2-node { 
            width: 120px; height: 120px; border-radius: 50%; background: #e6edf3; 
            border: 4px solid #30363d; cursor: pointer; transition: 0.3s; 
            box-shadow: 0 0 15px rgba(230, 237, 243, 0.1);
        }
        .s2-node:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(230, 237, 243, 0.3); }
        .s2-node.selected { border-color: #1f6feb; box-shadow: 0 0 30px rgba(31, 111, 235, 0.8); background: #fff; }
        .s2-node.locked { cursor: not-allowed; opacity: 0.5; }
        
        /* 満杯時のスタイル（水色） */
        .s2-node.full { background: #58a6ff; border-color: #1f6feb; box-shadow: 0 0 20px rgba(88, 166, 255, 0.5); }

        /* --- STEP 3: ターミナル --- */
        .puzzle-layout { display: flex; justify-content: center; align-items: flex-start; gap: 60px; margin: 0 auto; max-width: 900px; }
        
        .s3-slots-container {
            display: flex; flex-direction: column; gap: 40px; width: 180px; position: relative; padding: 0;
            background: linear-gradient(to right, 
                transparent 24%, #444 24%, #444 26%, 
                transparent 26%, transparent 49%, 
                #444 49%, #444 51%, 
                transparent 51%, transparent 74%, 
                #444 74%, #444 76%, transparent 76%);
        }
        .s3-slot { width: 180px; height: 60px; border: 3px solid #555; background: #161b22; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 1; transition: 0.2s; }
        .s3-slot.drag-over { background: #1f6feb; border-color: #58a6ff; }
        
        .s3-side-panel { display: flex; flex-direction: column; gap: 20px; }
        .s3-items { display: grid; grid-template-columns: 180px 180px; gap: 20px; padding: 20px; border: 2px dashed #444; border-radius: 10px; background: #161b22; }
        .s3-item-slot { width: 180px; height: 60px; background: transparent; }
        .s3-item { width: 180px; height: 60px; background: #30363d; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: grab; box-shadow: 2px 4px 8px rgba(0,0,0,0.5); transition: transform 0.1s; color: white; border: 1px solid #555; }
        .s3-item:active { cursor: grabbing; transform: scale(0.95); border-color: #58a6ff; }
    </style>
</head>
<body>

    <!-- グローバルヘッダー -->
    <div class="header">
        <div class="app-tabs">
            <button class="tab-btn active" id="tab-step1" onclick="switchApp('step1')">💻 C-123 (STEP1)</button>
            <button class="tab-btn" id="tab-step2" onclick="switchApp('step2')">🎛️ データ転送 (STEP2)</button>
            <button class="tab-btn" id="tab-step3" onclick="switchApp('step3')">📟 ターミナル (STEP3)</button>
        </div>
        <button class="btn-connect" onclick="connectSerial()">🔌 デバイス接続</button>
    </div>

    <!-- ========================================== -->
    <!-- APP 1: C-123 制作ソフト (STEP1) -->
    <!-- ========================================== -->
    <div class="app-container active" id="app-step1">
        <h2>C-123 制作ソフト</h2>
        
        <div class="terminal-box">
            <p>小謎の答えを入力せよ</p>
            <input type="text" id="answerInput-s1" placeholder="答えを入力">
            <button onclick="submitAnswerS1()">解答</button>
            <div class="feedback" id="terminalFeedback-s1"></div>
            <div class="hint-area" id="hintArea-s1">
                <p>【取得した解析データ: <span id="hintCount-s1">0</span>/6】</p>
                <div class="carousel-container">
                    <button class="carousel-btn" id="prevBtn-s1" onclick="prevSlideS1()">◀</button>
                    <div class="hint-image-wrapper"><img id="hintImage-s1" src="" alt="ヒント画像"></div>
                    <button class="carousel-btn" id="nextBtn-s1" onclick="nextSlideS1()">▶</button>
                </div>
                <div class="carousel-indicator" id="carouselIndicator-s1"></div>
            </div>
        </div>

        <div class="s1-slots">
            <div class="s1-slot slot" data-index="0" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
            <div class="s1-slot slot" data-index="1" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
            <div class="s1-slot slot" data-index="2" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
            <div class="s1-slot slot" data-index="3" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
            <div class="s1-slot slot" data-index="4" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
            <div class="s1-slot slot" data-index="5" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
        </div>

        <div class="s1-items" id="s1-item-pool" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)">
            <div class="s1-item-slot item-slot" id="pool-A"><div class="s1-item item" draggable="true" id="A" ondragstart="dragStep1(event)" ondragend="dragEndStep1(event)">A</div></div>
            <div class="s1-item-slot item-slot" id="pool-B"><div class="s1-item item" draggable="true" id="B" ondragstart="dragStep1(event)" ondragend="dragEndStep1(event)">B</div></div>
            <div class="s1-item-slot item-slot" id="pool-C"><div class="s1-item item" draggable="true" id="C" ondragstart="dragStep1(event)" ondragend="dragEndStep1(event)">C</div></div>
            <div class="s1-item-slot item-slot" id="pool-D"><div class="s1-item item" draggable="true" id="D" ondragstart="dragStep1(event)" ondragend="dragEndStep1(event)">D</div></div>
            <div class="s1-item-slot item-slot" id="pool-E"><div class="s1-item item" draggable="true" id="E" ondragstart="dragStep1(event)" ondragend="dragEndStep1(event)">E</div></div>
            <div class="s1-item-slot item-slot" id="pool-F"><div class="s1-item item" draggable="true" id="F" ondragstart="dragStep1(event)" ondragend="dragEndStep1(event)">F</div></div>
        </div>

        <button class="execute-btn" onclick="checkClearStep1()" style="max-width: 400px; margin: 0 auto; display: block;">判定を実行</button>
        <div id="result-step1" class="result-msg"></div>
    </div>

    <!-- ========================================== -->
    <!-- APP 2: データ転送 (STEP2) -->
    <!-- ========================================== -->
    <div class="app-container" id="app-step2">
        <h2>データ転送プロトコル</h2>
        
        <div class="terminal-box">
            <p>小謎の答えを入力せよ</p>
            <input type="text" id="answerInput-s2" placeholder="答えを入力">
            <button onclick="submitAnswerS2()">解答</button>
            <div class="feedback" id="terminalFeedback-s2"></div>
            <div class="hint-area" id="hintArea-s2">
                <p>【取得した解析データ: <span id="hintCount-s2">0</span>/4】</p>
                <div class="carousel-container">
                    <button class="carousel-btn" id="prevBtn-s2" onclick="prevSlideS2()">◀</button>
                    <div class="hint-image-wrapper"><img id="hintImage-s2" src="" alt="ヒント画像"></div>
                    <button class="carousel-btn" id="nextBtn-s2" onclick="nextSlideS2()">▶</button>
                </div>
                <div class="carousel-indicator" id="carouselIndicator-s2"></div>
            </div>
        </div>

        <div class="s2-container">
            <div class="s2-node full" id="node-0" onclick="handleNodeClick(0)"></div>
            <div class="s2-node" id="node-1" onclick="handleNodeClick(1)"></div>
            <div class="s2-node" id="node-2" onclick="handleNodeClick(2)"></div>
        </div>

        <div id="result-step2" class="result-msg"></div>
        <button class="execute-btn" onclick="resetStep2()" style="margin-top: 20px; background: #444; max-width: 200px; display: block; margin-left: auto; margin-right: auto;">🔄 リセット</button>
    </div>

    <!-- ========================================== -->
    <!-- APP 3: ターミナル (STEP3) -->
    <!-- ========================================== -->
    <div class="app-container" id="app-step3">
        <h2>ターミナル</h2>

        <div class="terminal-box">
            <p>小謎の答えを入力せよ</p>
            <input type="text" id="answerInput-s3" placeholder="答えを入力">
            <button onclick="submitAnswerS3()">解答</button>
            <div class="feedback" id="terminalFeedback-s3"></div>
            <div class="hint-area" id="hintArea-s3">
                <p>【取得した解析データ: <span id="hintCount-s3">0</span>/6】</p>
                <div class="carousel-container">
                    <button class="carousel-btn" id="prevBtn-s3" onclick="prevSlideS3()">◀</button>
                    <div class="hint-image-wrapper"><img id="hintImage-s3" src="" alt="ヒント画像"></div>
                    <button class="carousel-btn" id="nextBtn-s3" onclick="nextSlideS3()">▶</button>
                </div>
                <div class="carousel-indicator" id="carouselIndicator-s3"></div>
            </div>
        </div>

        <div class="puzzle-layout">
            <div class="s3-slots-container">
                <div class="s3-slot slot" data-index="0" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
                <div class="s3-slot slot" data-index="1" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
                <div class="s3-slot slot" data-index="2" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
                <div class="s3-slot slot" data-index="3" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
                <div class="s3-slot slot" data-index="4" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
            </div>

            <div class="s3-side-panel">
                <div class="s3-items" id="s3-item-pool" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)">
                    <div class="s3-item-slot item-slot" id="pool-SUN"><div class="s3-item item" draggable="true" id="SUN" ondragstart="dragStep3(event)">☀️</div></div>
                    <div class="s3-item-slot item-slot" id="pool-MON"><div class="s3-item item" draggable="true" id="MON" ondragstart="dragStep3(event)">🌙</div></div>
                    <div class="s3-item-slot item-slot" id="pool-TUE"><div class="s3-item item" draggable="true" id="TUE" ondragstart="dragStep3(event)">🔥</div></div>
                    <div class="s3-item-slot item-slot" id="pool-WED"><div class="s3-item item" draggable="true" id="WED" ondragstart="dragStep3(event)">💧</div></div>
                    <div class="s3-item-slot item-slot" id="pool-THU"><div class="s3-item item" draggable="true" id="THU" ondragstart="dragStep3(event)">🌳</div></div>
                    <div class="s3-item-slot item-slot" id="pool-FRI"><div class="s3-item item" draggable="true" id="FRI" ondragstart="dragStep3(event)">💰</div></div>
                    <div class="s3-item-slot item-slot" id="pool-SAT"><div class="s3-item item" draggable="true" id="SAT" ondragstart="dragStep3(event)">🪐</div></div>
                </div>
                <button class="execute-btn" onclick="executeMainPuzzle()">プロトコル実行</button>
                <div id="result-step3" class="result-msg"></div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 共通シリアル通信ロジック
        // ==========================================
        let port;
        let writer;

        async function connectSerial() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                const encoder = new TextEncoderStream();
                encoder.readable.pipeTo(port.writable);
                writer = encoder.writable.getWriter();
                alert("デバイスとの接続を確立しました。");
            } catch (err) { alert("接続エラー: " + err); }
        }

        async function sendCommand(cmd) {
            if (writer) await writer.write(cmd + "\n");
        }

        // ==========================================
        // UI: アプリ切り替え
        // ==========================================
        function switchApp(appId) {
            document.getElementById('app-step1').classList.remove('active');
            document.getElementById('app-step2').classList.remove('active');
            document.getElementById('app-step3').classList.remove('active');
            document.getElementById('tab-step1').classList.remove('active');
            document.getElementById('tab-step2').classList.remove('active');
            document.getElementById('tab-step3').classList.remove('active');

            document.getElementById(`app-${appId}`).classList.add('active');
            document.getElementById(`tab-${appId}`).classList.add('active');
        }

        // ==========================================
        // 共通ドラッグ＆ドロップロジック
        // ==========================================
        function allowDrop(e) { 
            e.preventDefault(); 
            if(e.target.classList.contains('slot') || e.target.id.includes('item-pool') || e.target.classList.contains('item-slot')) {
                e.target.classList.add('drag-over'); 
            }
        }
        function dragLeave(e) { e.target.classList.remove('drag-over'); }
        
        function drop(e) {
            e.preventDefault();
            e.target.classList.remove('drag-over');
            
            let dropTarget = e.target;
            if (dropTarget.classList.contains('item')) dropTarget = dropTarget.parentElement;

            const data = e.dataTransfer.getData("text");
            const draggedElement = document.getElementById(data);
            
            if (dropTarget.classList.contains('slot')) {
                if (dropTarget.children.length > 0) {
                    let existingItem = dropTarget.children[0];
                    document.getElementById("pool-" + existingItem.id).appendChild(existingItem);
                }
                dropTarget.appendChild(draggedElement);
            } 
            else if (dropTarget.id.includes("item-pool") || dropTarget.classList.contains('item-slot')) {
                document.getElementById("pool-" + draggedElement.id).appendChild(draggedElement);
            }
        }

        // ==========================================
        // STEP1 専用ロジック
        // ==========================================
        let s1_solved = new Set();
        let s1_images = [];
        let s1_slideIndex = 0;
        const s1_masterImages = ["s1_hint1.jpg", "s1_hint2.jpg", "s1_hint3.jpg", "s1_hint4.jpg", "s1_hint5.jpg", "s1_hint6.jpg"];
        const s1_dict = { "あめりか": "A", "ういるす": "B", "かしつき": "C", "くちびる": "D", "こくばん": "E", "ふうしゃ": "F" };

        function updateCarouselS1() {
            if (s1_images.length === 0) return;
            document.getElementById("hintImage-s1").src = s1_images[s1_slideIndex];
            document.getElementById("carouselIndicator-s1").innerText = `${s1_slideIndex + 1} / ${s1_images.length}`;
            document.getElementById("prevBtn-s1").disabled = s1_slideIndex === 0;
            document.getElementById("nextBtn-s1").disabled = s1_slideIndex === s1_images.length - 1;
        }
        function prevSlideS1() { if (s1_slideIndex > 0) { s1_slideIndex--; updateCarouselS1(); } }
        function nextSlideS1() { if (s1_slideIndex < s1_images.length - 1) { s1_slideIndex++; updateCarouselS1(); } }

        function submitAnswerS1() {
            const input = document.getElementById("answerInput-s1").value.trim();
            const feedback = document.getElementById("terminalFeedback-s1");
            if (s1_dict[input]) {
                if (!s1_solved.has(input)) {
                    s1_solved.add(input);
                    s1_images.push(s1_masterImages[s1_solved.size - 1]);
                    s1_slideIndex = s1_images.length - 1;
                }
                feedback.style.color = "#0f0";
                feedback.innerText = `データ承認（進捗: ${s1_solved.size}/6）`;
                document.getElementById("hintCount-s1").innerText = s1_solved.size;
                document.getElementById("hintArea-s1").style.display = "block";
                updateCarouselS1();
                sendCommand("B");
            } else {
                feedback.style.color = "red";
                feedback.innerText = "エラー: 該当するデータが見つかりません";
            }
        }

        // --- STEP1 パズル ---
        let currentPhase = 1;
        const answerPhase1 = ["B", "D", "C", "E", "F", "A"];
        const answerPhase2 = ["A", "E", "B", "F", "D", "C"];
        const ledPatterns = { 'A': 'P1010', 'B': 'P0101', 'C': 'P0011', 'D': 'P0011', 'E': 'P1011', 'F': 'P0110' };

        function dragStep1(e) {
            e.dataTransfer.setData("text", e.target.id);
            if (currentPhase === 2) sendCommand(ledPatterns[e.target.id]);
        }
        function dragEndStep1(e) {
            if (currentPhase === 2) sendCommand('P0000');
        }

        function checkClearStep1() {
            const slots = document.querySelectorAll('.s1-slot');
            let placedItems = [];
            for (let slot of slots) {
                if (slot.children.length === 0) {
                    document.getElementById("result-step1").innerText = "すべてのスロットを埋めてください！";
                    document.getElementById("result-step1").style.color = "#ff7b72";
                    return;
                }
                placedItems.push(slot.children[0].id);
            }

            const currentAnswer = (currentPhase === 1) ? answerPhase1 : answerPhase2;
            let isCorrect = true;
            for (let i = 0; i < 6; i++) {
                if (placedItems[i] !== currentAnswer[i]) isCorrect = false;
            }

            const resultDiv = document.getElementById("result-step1");
            if (isCorrect) {
                if (currentPhase === 1) {
                    resultDiv.innerHTML = "【解析完了】ライト取付指示書をダウンロードしました。<br><br><span style='color:#58a6ff;font-size:16px;'>指示書に従い4つのライトを配線し、<br>ブロックの「真のデータ」で再度並び替えよ。</span>";
                    resultDiv.style.color = "#2ea043";
                    currentPhase = 2;
                    setTimeout(() => {
                        placedItems.forEach(id => document.getElementById("pool-" + id).appendChild(document.getElementById(id)));
                    }, 3000);
                } else if (currentPhase === 2) {
                    resultDiv.innerText = "🎉 CLEAR! ファイル①のダウンロードが完了しました。";
                    resultDiv.style.color = "#2ea043";
                    sendCommand('P1111');
                }
            } else {
                resultDiv.innerText = "❌ エラー: 配列が間違っています。";
                resultDiv.style.color = "#ff7b72";
            }
        }

        // ==========================================
        // STEP2 専用ロジック
        // ==========================================
        let s2_solved = new Set();
        let s2_images = [];
        let s2_slideIndex = 0;
        const s2_masterImages = ["s2_hint1.jpg", "s2_hint2.jpg", "s2_hint3.jpg", "s2_hint4.jpg"]; 
        const s2_dict = { "てすと1": "1", "てすと2": "2", "てすと3": "3", "てすと4": "4" };

        function updateCarouselS2() {
            if (s2_images.length === 0) return;
            document.getElementById("hintImage-s2").src = s2_images[s2_slideIndex];
            document.getElementById("carouselIndicator-s2").innerText = `${s2_slideIndex + 1} / ${s2_images.length}`;
            document.getElementById("prevBtn-s2").disabled = s2_slideIndex === 0;
            document.getElementById("nextBtn-s2").disabled = s2_slideIndex === s2_images.length - 1;
        }
        function prevSlideS2() { if (s2_slideIndex > 0) { s2_slideIndex--; updateCarouselS2(); } }
        function nextSlideS2() { if (s2_slideIndex < s2_images.length - 1) { s2_slideIndex++; updateCarouselS2(); } }

        function submitAnswerS2() {
            const input = document.getElementById("answerInput-s2").value.trim();
            const feedback = document.getElementById("terminalFeedback-s2");
            if (s2_dict[input]) {
                if (!s2_solved.has(input)) {
                    s2_solved.add(input);
                    s2_images.push(s2_masterImages[s2_solved.size - 1]);
                    s2_slideIndex = s2_images.length - 1;
                }
                feedback.style.color = "#0f0";
                feedback.innerText = `データ承認（進捗: ${s2_solved.size}/${Object.keys(s2_dict).length}）`;
                document.getElementById("hintCount-s2").innerText = s2_solved.size;
                document.getElementById("hintArea-s2").style.display = "block";
                updateCarouselS2();
                sendCommand("B");
            } else {
                feedback.style.color = "red";
                feedback.innerText = "エラー: 該当するデータが見つかりません";
            }
        }

        // --- STEP2 パズル (水汲み) ---
        const S2_CAPACITIES = [10, 7, 3];
        let s2_volumes = [10, 0, 0];
        let s2_selectedNode = null;
        let s2_isTransferring = false;

        // ノードの見た目を更新（満杯なら水色にする）
        function updateNodeColors() {
            for (let i = 0; i < 3; i++) {
                const node = document.getElementById(`node-${i}`);
                if (s2_volumes[i] === S2_CAPACITIES[i] && S2_CAPACITIES[i] > 0) {
                    node.classList.add('full');
                } else {
                    node.classList.remove('full');
                }
            }
        }

        function handleNodeClick(index) {
            if (s2_isTransferring) return; 

            if (s2_selectedNode === null) {
                if (s2_volumes[index] === 0) return; 
                s2_selectedNode = index;
                document.getElementById(`node-${index}`).classList.add('selected');
            } else {
                if (s2_selectedNode === index) {
                    document.getElementById(`node-${index}`).classList.remove('selected');
                    s2_selectedNode = null;
                    return;
                }
                let from = s2_selectedNode;
                let to = index;
                document.getElementById(`node-${from}`).classList.remove('selected');
                s2_selectedNode = null;

                let transferAmount = Math.min(s2_volumes[from], S2_CAPACITIES[to] - s2_volumes[to]);
                if (transferAmount > 0) {
                    s2_volumes[from] -= transferAmount;
                    s2_volumes[to] += transferAmount;
                    playTransferBuzzer(transferAmount, () => {
                        updateNodeColors();
                        checkClearStep2();
                    });
                }
            }
        }

        function playTransferBuzzer(count, callback) {
            let beeps = 0;
            s2_isTransferring = true;
            document.querySelectorAll('.s2-node').forEach(n => n.classList.add('locked'));
            
            const interval = setInterval(() => {
                sendCommand("B");
                beeps++;
                if (beeps >= count) {
                    clearInterval(interval);
                    s2_isTransferring = false;
                    document.querySelectorAll('.s2-node').forEach(n => n.classList.remove('locked'));
                    if (callback) callback();
                }
            }, 500); 
        }

        function checkClearStep2() {
            if (s2_volumes[0] === 5 && s2_volumes[1] === 5) {
                const resultDiv = document.getElementById("result-step2");
                resultDiv.innerText = "🎉 同期完了！ファイル②のダウンロードが完了しました。";
                resultDiv.style.color = "#2ea043";
            }
        }

        function resetStep2() {
            if (s2_isTransferring) return;
            s2_volumes = [10, 0, 0];
            s2_selectedNode = null;
            document.querySelectorAll('.s2-node').forEach(n => n.classList.remove('selected'));
            updateNodeColors();
            
            document.getElementById("result-step2").innerText = "システムを初期化しました。";
            document.getElementById("result-step2").style.color = "#8b949e";
            setTimeout(() => { document.getElementById("result-step2").innerText = ""; }, 2000);
        }

        // ==========================================
        // STEP3 専用ロジック
        // ==========================================
        let segTimerS3, ledTimer; 
        let s3_solved = new Set();
        let s3_images = [];
        let s3_slideIndex = 0;

        const s3_masterImages = [
            "ここに1問目正解時の画像リンク", "step3_hint1.jpg", "step3_hint3.jpg", 
            "step3_hint4.jpg", "step3_hint5.jpg", "step3_hint2.jpg"
        ];
        const s3_dict = { "くま": "BEAR", "とり": "BIRD", "ほし": "STAR", "つき": "MOON", "さかな": "FISH", "ほん": "BOOK" };

        function updateCarouselS3() {
            if (s3_images.length === 0) return;
            document.getElementById("hintImage-s3").src = s3_images[s3_slideIndex];
            document.getElementById("carouselIndicator-s3").innerText = `${s3_slideIndex + 1} / ${s3_images.length}`;
            document.getElementById("prevBtn-s3").disabled = s3_slideIndex === 0;
            document.getElementById("nextBtn-s3").disabled = s3_slideIndex === s3_images.length - 1;
        }
        function prevSlideS3() { if (s3_slideIndex > 0) { s3_slideIndex--; updateCarouselS3(); } }
        function nextSlideS3() { if (s3_slideIndex < s3_images.length - 1) { s3_slideIndex++; updateCarouselS3(); } }

        function submitAnswerS3() {
            const input = document.getElementById("answerInput-s3").value.trim();
            const feedback = document.getElementById("terminalFeedback-s3");
            if (segTimerS3) clearTimeout(segTimerS3);

            if (s3_dict[input]) {
                const word = s3_dict[input];
                if (!s3_solved.has(input)) {
                    s3_solved.add(input);
                    s3_images.push(s3_masterImages[s3_solved.size - 1]);
                    s3_slideIndex = s3_images.length - 1;
                }
                feedback.style.color = "#0f0";
                feedback.innerText = `データ承認: 該当データを7セグへ出力（進捗: ${s3_solved.size}/6）`;
                
                document.getElementById("hintCount-s3").innerText = s3_solved.size;
                document.getElementById("hintArea-s3").style.display = "block";
                updateCarouselS3();
                
                let cmd = "S";
                for(let i = 0; i < 4; i++) cmd += getRow(word[i]);
                sendCommand(cmd);

                segTimerS3 = setTimeout(() => {
                    sendCommand("S0000");
                    feedback.innerText = "スタンバイ...";
                }, 3000);
            } else {
                feedback.style.color = "red";
                feedback.innerText = "エラー: 該当するデータが見つかりません";
                sendCommand("S0000");
            }
        }

        function dragStep3(e) { e.dataTransfer.setData("text", e.target.id); }

        function executeMainPuzzle() {
            const slots = document.querySelectorAll('.s3-slot');
            let placedWords = [];
            for (let slot of slots) {
                if (slot.children.length === 0) {
                    alert("5つのモジュールを全てセットしてください。");
                    return;
                }
                placedWords.push(slot.children[0].id);
            }
            let validJoints = 0;
            for (let i = 0; i < 4; i++) {
                let word1 = placedWords[i], word2 = placedWords[i+1];
                if (getRow(word1[0]) !== getRow(word2[0]) && getRow(word1[1]) !== getRow(word2[1]) && getRow(word1[2]) !== getRow(word2[2])) {
                    validJoints++;
                }
            }
            if (ledTimer) clearTimeout(ledTimer);
            if (validJoints === 0) {
                sendCommand("L0"); sendCommand("B");
            } else {
                sendCommand("L" + validJoints);
                ledTimer = setTimeout(() => sendCommand("L0"), 3000);
            }
            if (validJoints === 4) {
                clearTimeout(ledTimer);
                setTimeout(() => {
                    document.getElementById("result-step3").innerText = "🎉 SYSTEM UNLOCKED! 完全クリア！";
                    document.getElementById("result-step3").style.color = "#0f0";
                }, 500);
            }
        }
        
        // 初期状態の色を反映
        window.addEventListener('DOMContentLoaded', () => {
            updateNodeColors();
        });
    </script>
</body>
</html>

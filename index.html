<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ターミナル</title>
    <style>
        body { font-family: sans-serif; background: #f5f5f5; text-align: center; padding: 20px; margin: 0; }
        .btn { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; border-radius: 5px; border: none; background: #007bff; color: white;}
        .btn:hover { background: #0056b3; }
        
        /* --- 小謎入力エリア --- */
        .terminal-box { background: #222; color: #0f0; padding: 20px; border-radius: 5px; margin: 10px auto; max-width: 600px; }
        .terminal-box input { padding: 8px; font-size: 18px; width: 200px; text-align: center; border: 1px solid #555; }
        .feedback { margin-top: 10px; font-weight: bold; min-height: 24px; white-space: pre-line; }

        /* --- ヒント画像エリア（スライダー形式） --- */
        .hint-area { margin-top: 15px; display: none; background: #111; padding: 15px; border-radius: 5px; border: 1px solid #444; }
        .hint-area p { color: #aaa; margin: 0 0 10px 0; font-size: 14px; }
        
        .carousel-container { display: flex; align-items: center; justify-content: center; gap: 15px; }
        .carousel-btn { background: none; border: none; color: #0f0; font-size: 30px; cursor: pointer; padding: 0 10px; transition: 0.2s; }
        .carousel-btn:hover { color: #fff; }
        .carousel-btn:disabled { color: #444; cursor: not-allowed; }
        
        .hint-image-wrapper { width: 300px; height: 200px; display: flex; align-items: center; justify-content: center; background: #000; border-radius: 5px; overflow: hidden; }
        .hint-image-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .carousel-indicator { color: #888; font-size: 14px; margin-top: 10px; }

        /* --- 画面全体のレイアウト --- */
        .puzzle-layout {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 60px;
            margin: 30px auto;
            max-width: 900px;
        }
        
        /* --- 左側：スロットエリア --- */
        .slots-container {
            display: flex; 
            flex-direction: column; 
            gap: 40px; 
            width: 180px; 
            position: relative; 
            padding: 0;
            background: linear-gradient(to right, 
                transparent 24%, black 24%, black 26%, 
                transparent 26%, transparent 49%, 
                black 49%, black 51%, 
                transparent 51%, transparent 74%, 
                black 74%, black 76%, transparent 76%);
        }
        
        .slot {
            width: 180px; height: 60px;
            border: 3px solid black; background: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; z-index: 1; transition: 0.2s;
        }
        .slot.drag-over { background: #e0f7fa; border-color: #00acc1; }

        /* --- 右側：パーツ置き場＆ボタンエリア --- */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .items { 
            display: grid; 
            grid-template-columns: 180px 180px; 
            gap: 20px; 
            padding: 20px; 
            border: 2px dashed #ccc; 
            border-radius: 10px;
            background: #fafafa;
        }
        .items.drag-over { border-color: #888; background: #eaeaea; }
        
        .item-slot {
            width: 180px; height: 60px;
            background: transparent;
        }

        .item {
            width: 180px; height: 60px;
            background: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; cursor: grab;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.2); transition: transform 0.1s;
        }
        .item:active { cursor: grabbing; transform: scale(0.95); }

        .execute-btn {
            background: #28a745;
            font-size: 20px;
            padding: 15px;
            width: 100%;
            margin: 0;
            font-weight: bold;
        }
        .execute-btn:hover { background: #218838; }
    </style>
</head>
<body>

    <button class="btn" onclick="connectSerial()">🔌 デバイス接続</button>

    <!-- 小謎入力エリア -->
    <div class="terminal-box">
        <p>小謎の答えを入力せよ</p>
        <input type="text" id="answerInput" placeholder="例: くま">
        <button class="btn" onclick="submitAnswer()">解答</button>
        <div class="feedback" id="terminalFeedback"></div>
        
        <!-- ★ヒント画像表示部分（スライダー） -->
        <div class="hint-area" id="hintArea">
            <p>【取得した解析データ: <span id="hintCount">0</span>/6】</p>
            <div class="carousel-container">
                <button class="carousel-btn" id="prevBtn" onclick="prevSlide()">◀</button>
                <div class="hint-image-wrapper">
                    <img id="hintImage" src="" alt="ヒント画像">
                </div>
                <button class="carousel-btn" id="nextBtn" onclick="nextSlide()">▶</button>
            </div>
            <div class="carousel-indicator" id="carouselIndicator"></div>
        </div>
    </div>

    <!-- メインパズルエリア（左右分割） -->
    <div class="puzzle-layout">
        
        <!-- 左側：スロット -->
        <div class="slots-container" id="slotsArea">
            <div class="slot" data-index="0" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
            <div class="slot" data-index="1" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
            <div class="slot" data-index="2" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
            <div class="slot" data-index="3" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
            <div class="slot" data-index="4" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)"></div>
        </div>

        <!-- 右側：パーツ置き場 ＆ 実行ボタン -->
        <div class="side-panel">
            <div class="items" id="item-pool" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)">
                <div class="item-slot" id="pool-SUN"><div class="item" draggable="true" id="SUN" ondragstart="drag(event)">☀️</div></div>
                <div class="item-slot" id="pool-MON"><div class="item" draggable="true" id="MON" ondragstart="drag(event)">🌙</div></div>
                <div class="item-slot" id="pool-TUE"><div class="item" draggable="true" id="TUE" ondragstart="drag(event)">🔥</div></div>
                <div class="item-slot" id="pool-WED"><div class="item" draggable="true" id="WED" ondragstart="drag(event)">💧</div></div>
                <div class="item-slot" id="pool-THU"><div class="item" draggable="true" id="THU" ondragstart="drag(event)">🌳</div></div>
                <div class="item-slot" id="pool-FRI"><div class="item" draggable="true" id="FRI" ondragstart="drag(event)">💰</div></div>
                <div class="item-slot" id="pool-SAT"><div class="item" draggable="true" id="SAT" ondragstart="drag(event)">🪐</div></div>
            </div>
            
            <button class="btn execute-btn" onclick="executeMainPuzzle()">判定</button>
        </div>

    </div>

    <script>
        let port;
        let writer;
        let segTimer; 
        let ledTimer; 

        // 小謎の記録リスト
        const solvedPuzzles = new Set();
        // 取得済みの画像URLリスト（スライダー表示用）
        let unlockedImages = [];
        // 現在表示しているスライドのインデックス
        let currentSlideIndex = 0;

        // 全てのヒント画像マスターデータ
        const masterHintImages = [
            "ここに1問目正解時の画像リンクを貼ってください",
            "ここに2問目正解時の画像リンクを貼ってください",
            "step3_hint1.jpg",
            "step3_hint3.jpg",
            "step3_hint4.jpg",
            "step3_hint2.jpg"
        ];

        const puzzleDict = {
            "くま": "BEAR",
            "とり": "BIRD",
            "ほし": "STAR",
            "つき": "MOON",
            "さかな": "FISH",
            "ほん": "BOOK"
        };

        const QWERTY_TOP = "QWERTYUIOP";
        const QWERTY_MID = "ASDFGHJKL";
        const QWERTY_BOT = "ZXCVBNM";

        function getRow(char) {
            if (QWERTY_TOP.includes(char)) return 1;
            if (QWERTY_MID.includes(char)) return 2;
            if (QWERTY_BOT.includes(char)) return 3;
            return 0;
        }

        async function connectSerial() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                const encoder = new TextEncoderStream();
                encoder.readable.pipeTo(port.writable);
                writer = encoder.writable.getWriter();
                alert("接続成功！");
            } catch (err) { alert("接続エラー: " + err); }
        }

        async function sendCommand(cmd) {
            if (writer) await writer.write(cmd + "\n");
        }

        // --- スライダーの描画更新 ---
        function updateCarousel() {
            if (unlockedImages.length === 0) return;
            
            document.getElementById("hintImage").src = unlockedImages[currentSlideIndex];
            document.getElementById("carouselIndicator").innerText = `${currentSlideIndex + 1} / ${unlockedImages.length}`;
            
            // 矢印ボタンの有効/無効切り替え
            document.getElementById("prevBtn").disabled = currentSlideIndex === 0;
            document.getElementById("nextBtn").disabled = currentSlideIndex === unlockedImages.length - 1;
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                updateCarousel();
            }
        }

        function nextSlide() {
            if (currentSlideIndex < unlockedImages.length - 1) {
                currentSlideIndex++;
                updateCarousel();
            }
        }

        function submitAnswer() {
            const input = document.getElementById("answerInput").value.trim();
            const feedback = document.getElementById("terminalFeedback");
            
            if (segTimer) clearTimeout(segTimer);

            if (puzzleDict[input]) {
                const word = puzzleDict[input];
                
                // 新しい言葉が入力されたら、スライダーに画像を追加
                if (!solvedPuzzles.has(input)) {
                    solvedPuzzles.add(input);
                    const newScore = solvedPuzzles.size;
                    unlockedImages.push(masterHintImages[newScore - 1]);
                    
                    // 新しい画像が追加されたら、その最新画像に自動でスライドを合わせる
                    currentSlideIndex = unlockedImages.length - 1;
                }
                
                const currentScore = solvedPuzzles.size;
                feedback.style.color = "#0f0";
                feedback.innerText = `データ承認: 該当データを7セグモニターへ出力します\n（データ解析進捗: ${currentScore}/6）`;
                
                // スライダーエリアを表示して更新
                document.getElementById("hintCount").innerText = currentScore;
                document.getElementById("hintArea").style.display = "block";
                updateCarousel();
                
                let cmd = "S";
                for(let i = 0; i < 4; i++) {
                    cmd += getRow(word[i]);
                }
                sendCommand(cmd);

                segTimer = setTimeout(() => {
                    sendCommand("S0000");
                    feedback.innerText = "スタンバイ...";
                }, 3000);

            } else {
                feedback.style.color = "red";
                feedback.innerText = "エラー: 該当するデータが見つかりません";
                sendCommand("S0000");
            }
        }

        // --- ドラッグ＆ドロップ処理 ---
        function drag(e) { e.dataTransfer.setData("text", e.target.id); }
        
        function allowDrop(e) { 
            e.preventDefault(); 
            if(e.target.classList.contains('slot') || e.target.id === 'item-pool' || e.target.classList.contains('items') || e.target.classList.contains('item-slot')) {
                e.target.classList.add('drag-over'); 
            }
        }
        
        function dragLeave(e) { e.target.classList.remove('drag-over'); }
        
        function drop(e) {
            e.preventDefault();
            e.target.classList.remove('drag-over');
            
            let dropTarget = e.target;
            if (dropTarget.classList.contains('item')) {
                dropTarget = dropTarget.parentElement;
            }

            const data = e.dataTransfer.getData("text");
            const draggedElement = document.getElementById(data);
            
            if (dropTarget.classList.contains('slot')) {
                if (dropTarget.children.length > 0) {
                    let existingItem = dropTarget.children[0];
                    document.getElementById("pool-" + existingItem.id).appendChild(existingItem);
                }
                dropTarget.appendChild(draggedElement);
            } 
            else if (dropTarget.id === "item-pool" || dropTarget.classList.contains('items') || dropTarget.classList.contains('item-slot')) {
                document.getElementById("pool-" + draggedElement.id).appendChild(draggedElement);
            }
        }

        // --- 大謎(曜日スロット)の判定処理 ---
        function executeMainPuzzle() {
            const slots = document.querySelectorAll('.slot');
            let placedWords = [];
            
            for (let slot of slots) {
                if (slot.children.length === 0) {
                    alert("5つのモジュールを全てセットしてください。");
                    return;
                }
                placedWords.push(slot.children[0].id);
            }

            let validJoints = 0;
            
            for (let i = 0; i < 4; i++) {
                let word1 = placedWords[i];
                let word2 = placedWords[i+1];
                
                if (getRow(word1[0]) !== getRow(word2[0]) &&
                    getRow(word1[1]) !== getRow(word2[1]) &&
                    getRow(word1[2]) !== getRow(word2[2])) {
                    validJoints++;
                }
            }

            if (ledTimer) clearTimeout(ledTimer);

            if (validJoints === 0) {
                sendCommand("L0");
                sendCommand("B");
            } else {
                sendCommand("L" + validJoints);
                ledTimer = setTimeout(() => {
                    sendCommand("L0");
                }, 3000);
            }
            
            if (validJoints === 4) {
                clearTimeout(ledTimer);
                setTimeout(() => alert("🎉 SYSTEM UNLOCKED! 完全クリア！"), 500);
            }
        }
    </script>
</body>
</html>
